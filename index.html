<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Merry Christmas - 3D ASCII Christmas Tree</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: #05070d;
      color: #d8e2ef;
      font-family: "SF Mono", "Menlo", "Monaco", "Cascadia Mono", "Consolas", "Courier New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "MS Gothic", monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #ascii-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      background-color: #05070d;
    }
  </style>
</head>
<body>
  <canvas id="ascii-canvas"></canvas>
  <script src="audio.js"></script>
  <script src="tree3d.js"></script>
</body>
</html>
